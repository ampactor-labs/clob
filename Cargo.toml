[package]
name = "clob"
version = "0.1.0"
edition = "2021"
description = "The Kernel — a self-improving ternary recurrent intelligence"

[dependencies]
serde = { version = "1", features = ["derive"] }
bincode = "1"
rand = "0.8"
rayon = "1.10"
clap = { version = "4", features = ["derive"] }
memmap2 = "0.9"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
